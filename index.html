<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pimienta &amp; Ron</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-block">
      <div>
        <h1 class="brand-title">Pimienta &amp; Ron</h1>
        <p class="brand-sub">Diseños que cuentan historias.</p>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">No hay diseños en esta categoría todavía.</div>
  <div class="load-state" id="loading">Cargando catálogo…</div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card">
    <button class="modal-close" type="button" aria-label="Cerrar">&times;</button>
    <div class="modal-thumb" id="modal-thumb"></div>
    <div class="modal-body">
      <span class="badge" id="modal-badge"></span>
      <h2 class="modal-name" id="modal-name"></h2>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-contacts" id="modal-contacts"></div>
    </div>
  </div>
</div>

<footer>
  Catálogo de sublimado · escribinos por <a id="ig-link" href="#" target="_blank" rel="noopener">Instagram</a>
</footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/filters.js"></script>
<script src="js/products.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>

</body>
</html>
