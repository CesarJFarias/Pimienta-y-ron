<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de sublimado — Pimienta &amp; Ron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/*
  =========================================================
  CÓMO EDITAR ESTE CATÁLOGO
  =========================================================
  Los productos y categorías YA NO se editan en este archivo.
  Se administran desde el panel en /admin, que guarda los
  cambios en content/productos.json y content/categorias.json.
  Esta página simplemente lee esos dos archivos cada vez que
  alguien la visita.

  El número de WhatsApp y el link de Instagram sí se configuran
  acá abajo, en el bloque <script> al final del archivo.
  =========================================================
*/

:root{
  --bg: #F3E7D6;
  --surface: #FFFFFF;
  --ink: #2E3D28;
  --ink-soft: #6B6153;
  --line: #E2D3B8;
  --rust: #B14A2A;
  --rust-ink: #6B2C18;
  --gold: #C9A227;
  --gold-ink: #6E561A;
  --radius: 14px;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Jost', system-ui, sans-serif;
  line-height: 1.5;
}

.wrap{
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ---------- Header ---------- */

header{
  padding: 56px 24px 40px;
  border-bottom: 1px solid var(--line);
}

.header-inner{
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  flex-wrap: wrap;
}

.brand-block{
  display: flex;
  align-items: center;
  gap: 18px;
}

.brand-logo{
  width: 76px;
  height: 76px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--line);
  flex-shrink: 0;
}

.brand-title{
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 60px;
  letter-spacing: 0.01em;
  line-height: 1;
  margin: 0;
}

.brand-sub{
  color: var(--rust);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.02em;
  margin: 10px 0 0;
  max-width: 480px;
}

.ink-strip{
  display: flex;
  gap: 6px;
}
.ink-dot{
  width: 14px; height: 14px; border-radius: 50%;
}

/* ---------- Filtros ---------- */

.filters{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 36px 0 32px;
}

.filter-btn{
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}

.filter-btn:hover{ border-color: var(--ink-soft); }

.filter-btn.active{
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.filter-btn.disabled{
  color: var(--ink-soft);
  cursor: default;
  opacity: 0.55;
}
.filter-btn.disabled:hover{ border-color: var(--line); }

/* ---------- Grid ---------- */

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 28px;
}

.card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.card:hover{
  transform: translateY(-4px);
  box-shadow: 0 14px 34px rgba(46,61,40,.10);
  border-color: var(--ink-soft);
}
.card:focus-visible{
  outline: 2px solid var(--rust);
  outline-offset: 2px;
}

.thumb{
  aspect-ratio: 4/5;
  display: flex;
  align-items: center;
  justify-content: center;
  background-size: cover;
  background-position: center;
  background-color: var(--line);
  transition: transform .4s ease;
}
.card:hover .thumb{ transform: scale(1.03); }

.thumb-mark{
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  color: var(--ink-soft);
  letter-spacing: 1px;
}

.card-body{
  padding: 18px 18px 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.card-name{
  font-weight: 600;
  font-size: 18px;
  margin: 0;
}

.card-desc{
  color: var(--ink-soft);
  font-size: 14px;
  margin: 0;
  flex: 1;
}

.badge{
  align-self: flex-start;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  background: #F1E4BE;
  color: var(--gold-ink);
}

/* ---------- Modal ---------- */

.modal{
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(46,61,40,.55);
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility .25s ease;
}
.modal.open{
  opacity: 1;
  visibility: visible;
}

.modal-card{
  position: relative;
  width: 100%;
  max-width: 440px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 18px;
  transform: translateY(16px) scale(.98);
  transition: transform .25s ease;
}
.modal.open .modal-card{ transform: translateY(0) scale(1); }

.modal-close{
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(243,231,214,.92);
  color: var(--ink);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s ease, transform .2s ease;
}
.modal-close:hover{ background: var(--bg); transform: rotate(90deg); }

.modal-thumb{
  aspect-ratio: 4/5;
  width: 100%;
  background-size: cover;
  background-position: center;
  background-color: var(--line);
}

.modal-body{
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-name{
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 30px;
  line-height: 1.1;
  margin: 0;
}

.modal-desc{
  color: var(--ink-soft);
  font-size: 15px;
  margin: 0;
}

.contact-btn{
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--rust);
  color: #FBF3EA;
  text-decoration: none;
  padding: 13px 18px;
  border-radius: 11px;
  font-size: 14.5px;
  font-weight: 600;
}
.contact-btn:hover{ opacity: 0.88; }

body.no-scroll{ overflow: hidden; }

.empty-state, .load-state{
  text-align: center;
  color: var(--ink-soft);
  padding: 60px 20px;
  font-size: 14px;
}

/* ---------- Footer ---------- */

footer{
  text-align: center;
  padding: 40px 24px 60px;
  color: var(--ink-soft);
  font-size: 13px;
}
footer a{ color: var(--ink); }

@media (max-width: 600px){
  .brand-title{ font-size: 40px; }
  .grid{ gap: 16px; }
  .card-body{ padding: 14px 14px 18px; }
  .card-name{ font-size: 16px; }
  .card-desc{ font-size: 13px; }

  .modal{
    padding: 0;
    align-items: flex-end;
  }
  .modal-card{
    max-width: none;
    max-height: 92dvh;
    border-radius: 18px 18px 0 0;
  }
  .modal-thumb{ aspect-ratio: 1/1; }
  .modal-body{ padding: 18px 20px 26px; }
  .modal-name{ font-size: 26px; }
  .modal-desc{ font-size: 14.5px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-block">
      <div>
        <h1 class="brand-title">Pimienta &amp; Ron</h1>
        <p class="brand-sub">Diseños que cuentan historias.</p>
      </div>
    </div>
    <div class="ink-strip" aria-hidden="true">
      <span class="ink-dot" style="background: var(--rust);"></span>
      <span class="ink-dot" style="background: var(--gold);"></span>
      <span class="ink-dot" style="background: var(--ink);"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">No hay diseños en esta categoría todavía.</div>
  <div class="load-state" id="loading">Cargando catálogo…</div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card">
    <button class="modal-close" type="button" aria-label="Cerrar">&times;</button>
    <div class="modal-thumb" id="modal-thumb"></div>
    <div class="modal-body">
      <span class="badge" id="modal-badge"></span>
      <h2 class="modal-name" id="modal-name"></h2>
      <p class="modal-desc" id="modal-desc"></p>
      <a class="contact-btn" id="modal-wa" href="#" target="_blank" rel="noopener">Consultar por WhatsApp</a>
    </div>
  </div>
</div>

<footer>
  Catálogo de sublimado · escribinos por <a id="ig-link" href="#" target="_blank" rel="noopener">Instagram</a>
</footer>

<script>
  // ---- CONFIGURACIÓN (editar acá) ----
  const WHATSAPP_NUMBER = "5492613400336"; // código de país + área + número, sin + ni espacios
  const INSTAGRAM_URL = "https://www.instagram.com/pimienta_yron";

  // ---- LÓGICA ----
  document.getElementById("ig-link").href = INSTAGRAM_URL;

  const filtersEl = document.getElementById("filters");
  const gridEl = document.getElementById("grid");
  const emptyEl = document.getElementById("empty");
  const loadingEl = document.getElementById("loading");

  const modalEl = document.getElementById("modal");
  const modalThumb = document.getElementById("modal-thumb");
  const modalBadge = document.getElementById("modal-badge");
  const modalName = document.getElementById("modal-name");
  const modalDesc = document.getElementById("modal-desc");
  const modalWa = document.getElementById("modal-wa");
  const modalClose = modalEl.querySelector(".modal-close");

  let CATEGORIES = [];
  let DESIGNS = [];
  let activeFilter = "todas";

  async function cargarDatos(){
    try{
      const [productosRes, categoriasRes] = await Promise.all([
        fetch("content/productos.json?_=" + Date.now()),
        fetch("content/categorias.json?_=" + Date.now())
      ]);
      const productosData = await productosRes.json();
      const categoriasData = await categoriasRes.json();

      DESIGNS = productosData.items || [];
      CATEGORIES = [{ id: "todas", etiqueta: "Todas", activa: true }, ...(categoriasData.items || [])];

      loadingEl.style.display = "none";
      renderFilters();
      renderGrid();
    } catch (err){
      loadingEl.textContent = "No se pudo cargar el catálogo. Probá recargar la página.";
    }
  }

  function renderFilters(){
    filtersEl.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      const disabled = cat.activa === false;
      btn.className = "filter-btn" + (cat.id === activeFilter ? " active" : "") + (disabled ? " disabled" : "");
      btn.textContent = disabled ? cat.etiqueta + " · próximamente" : cat.etiqueta;
      btn.type = "button";
      if(!disabled){
        btn.addEventListener("click", () => {
          activeFilter = cat.id;
          renderFilters();
          renderGrid();
        });
      }
      filtersEl.appendChild(btn);
    });
  }

  function renderGrid(){
    const items = activeFilter === "todas" ? DESIGNS : DESIGNS.filter(d => d.tipo === activeFilter);
    gridEl.innerHTML = "";
    emptyEl.style.display = items.length ? "none" : "block";

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Ver detalle de " + item.nombre);
      card.addEventListener("click", () => abrirModal(item));
      card.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          abrirModal(item);
        }
      });

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if(item.foto){
        thumb.style.backgroundImage = "url(" + item.foto + ")";
      } else {
        const mark = document.createElement("span");
        mark.className = "thumb-mark";
        mark.textContent = "FOTO PENDIENTE";
        thumb.appendChild(mark);
      }

      const body = document.createElement("div");
      body.className = "card-body";

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = item.tipo.charAt(0).toUpperCase() + item.tipo.slice(1);

      const name = document.createElement("p");
      name.className = "card-name";
      name.textContent = item.nombre;

      const desc = document.createElement("p");
      desc.className = "card-desc";
      desc.textContent = item.descripcion;

      body.append(badge, name, desc);
      card.append(thumb, body);
      gridEl.appendChild(card);
    });
  }

  function abrirModal(item){
    modalBadge.textContent = item.tipo.charAt(0).toUpperCase() + item.tipo.slice(1);
    modalName.textContent = item.nombre;
    modalDesc.textContent = item.descripcion;

    modalThumb.style.backgroundImage = item.foto
      ? "url(" + item.foto + ")"
      : "none";

    modalWa.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" +
      encodeURIComponent("Hola! Me interesa el diseño \"" + item.nombre + "\"");

    modalEl.classList.add("open");
    modalEl.setAttribute("aria-hidden", "false");
    document.body.classList.add("no-scroll");
  }

  function cerrarModal(){
    modalEl.classList.remove("open");
    modalEl.setAttribute("aria-hidden", "true");
    document.body.classList.remove("no-scroll");
  }

  modalClose.addEventListener("click", cerrarModal);
  modalEl.addEventListener("click", e => {
    if(e.target === modalEl) cerrarModal();
  });
  window.addEventListener("keydown", e => {
    if(e.key === "Escape" && modalEl.classList.contains("open")) cerrarModal();
  });

  cargarDatos();
</script>

</body>
</html>
